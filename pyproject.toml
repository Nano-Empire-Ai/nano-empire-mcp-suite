[project]
name = "nano-empire-mcp-suite"
version = "0.1.0"
description = "Enterprise MCP servers for AI RFP teardown, codebase auditing, and A2A routing."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "x402", "USDC", "Solana", "Base", "Ethereum", "Arbitrum", "Polygon",
  "MCP", "Model Context Protocol", "agent-to-agent", "A2A",
  "autonomous payments", "machine economy", "Stripe Issuing", 
  "virtual card", "fiat bridge", "crypto payments", "micropayments",
  "Cerberus", "MAB", "tollbooth", "faucet"
]
dependencies = [
    "mcp<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "nano-empire-tollbooth>=0.3.0",
    "requests>=2.34.2",
    "psycopg[binary]>=3.3.5",
    "pygithub>=2.10.0",
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0"
]

[project.scripts]
nano-mcp = "nano_mcp_suite.run_server:main"
